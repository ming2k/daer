#:schema ./daer.schema.json
# daer — reference configuration
#
# Check it with `daer check -c <this file>`; the schema is `daer schema`.
# Every table is optional: an empty file is a valid configuration, and the
# defaults below are the ones daer actually uses.
#
# Unknown keys are errors, not warnings: a typo must fail loudly.

# Schema version. daer refuses a version it does not understand.
schema = 1

# Extra files, relative to this one. Tables merge key by key, arrays are
# concatenated, and a key set twice is an error.
#include = ["conf.d/*.toml"]

[global]
# Transparent-proxy port. This is not an HTTP/SOCKS port: the eBPF program
# redirects intercepted traffic here.
tproxy-port = 12345
# Refuse traffic that did not come through the eBPF program.
tproxy-port-protect = true
# Socket mark for daer-originated traffic. Omit to let daer pick an internal
# mark that prevents UDP self-capture.
#so-mark = 0
# tracing filter directive: "info", "debug", or "daer=debug,netune=trace".
log-level = "info"

# Interfaces to proxy. "auto" detects the default route's interface.
#lan-interface = ["docker0"]
wan-interface = ["auto"]

# How long to wait for a sniffable byte sequence before falling back to IP.
sniffing-timeout = "30ms"
auto-sniff-punt = true

allow-insecure = false
disable-waiting-network = false


[global.tls]
# TLS fingerprint preset owned by netune: "netune-default", "chrome-current",
# "firefox-current", "safari-current", "codex-reqwest", "codex-network-proxy".
# Unknown names fail
# at load time instead of silently falling back to the default identity.
#profile = "chrome-current"
# Split the ClientHello across TCP segments to defeat naive SNI filtering.
fragment = false
fragment-length = "50-100"
fragment-interval = "10-20"

# Health-check defaults; each [[group]] may override any of these.
[global.health-check]
# URL first, then optional direct IPs so the probe does not depend on DNS.
tcp-url = ["http://cp.cloudflare.com", "1.1.1.1", "2606:4700:4700::1111"]
tcp-method = "HEAD"
# Bare IPs mean port 53; a name is reported and skipped, never silently resolved.
udp-dns = ["dns.google:53", "8.8.8.8", "2001:4860:4860::8888"]
interval = "30s"
# Shifts the switching threshold of moving averages; may be negative.
tolerance = "0s"

# Subscriptions are merged into the node pool. Either write bare URLs
# (`subscription = ["https://…"]`) or these tables, not both.
#[[subscription]]
#tag = "my_sub"
#url = "https://www.example.com/subscription/link"
## Cache the last successful fetch next to the configuration.
#persist = false

# Nodes, also merged into the pool.
#
# Nodes in configuration must be declared as structured tables (with explicit
# type checking and editor schema validation). A URI link (vless://, ss://,
# trojan://, …) does not need hand-converting: declare it as a `[[subscription]]`
# and the pool is filled on load and on every reload.
#
# A chain (`a -> b`) is NOT supported by this build: it is rejected at validation
# rather than silently truncated to its first hop. Listing one here is an error.
#
# A `vless` or `vmess` node is three orthogonal layers (ADR-0028):
#
#   [node.transport]  tcp (default) or ws — sits *above* the security layer, so
#                     `transport = ws` + `security = tls` is `wss://`
#   [node.security]   none (default), tls or reality
#   flow              none (default) or xtls-rprx-vision, which needs TLS or REALITY
#                     *directly* under the protocol (not behind ws: the reference
#                     refuses that combination too)
#
# Structured VLESS over REALITY with Vision:
#[[node]]
#tag = "edge"
#type = "vless"
#server = "198.51.100.1"
#port = 443
#uuid = "b831381d-6324-4d53-ad4f-8cda48b30811"
#flow = "xtls-rprx-vision"
#[node.security]
#type = "reality"
#sni = "example.com"
#public-key = "f26c_e2kFv8-39rQz10M_xU8vI3f9Qk2lW0mNoPqRsT"
#short-id = "ab01cd02"
#
# Structured VLESS over TLS behind a CDN (wss):
#[[node]]
#tag = "cdn"
#type = "vless"
#server = "198.51.100.4"
#port = 443
#uuid = "b831381d-6324-4d53-ad4f-8cda48b30811"
#[node.security]
#type = "tls"
#sni = "cdn.example.com"
#[node.transport]
#type = "ws"
#path = "/ray"
#host = "cdn.example.com"
#
# Structured VMess (AEAD only; a non-zero alterId is refused — ADR-0030):
#[[node]]
#tag = "vm"
#type = "vmess"
#server = "198.51.100.5"
#port = 443
#uuid = "b831381d-6324-4d53-ad4f-8cda48b30811"
#cipher = "auto"
#[node.security]
#type = "tls"
#sni = "node.example.com"
#
# Structured Hysteria 2 (ADR-0029). `ports` accepts one port, a list or a range;
# `hop-interval` rotates the source port, which is what defeats a per-flow
# throttle, and needs at least 5s:
#[[node]]
#tag = "hy2"
#type = "hysteria2"
#server = "198.51.100.6"
#ports = "443,20000-20010"
#password = "secret"
#sni = "hy2.example.com"
#up-mbps = 100
#down-mbps = 200
#congestion = "brutal"
#hop-interval = "30s"
#[node.obfs]
#type = "salamander"
#password = "cry_me_a_r1ver"
#
# Structured Shadowsocks example:
#[[node]]
#tag = "ss"
#type = "shadowsocks"
#server = "198.51.100.2"
#port = 8388
#method = "chacha20-ietf-poly1305"
#password = "secret"
#
# Structured SOCKS5 example:
#[[node]]
#tag = "local"
#type = "socks5"
#server = "127.0.0.1"
#port = 1080

# A group selects nodes from the pool and picks one per connection.
[[group]]
name = "proxy"
# "random", "fixed(0)", "min", "min-moving-avg", "min-avg10", …
policy = "min-moving-avg"
# Filters are OR-ed; each is a conjunction. An annotation is carried into the
# selected node's properties.
#filters = [
#    "subtag(my_sub) && !name(keyword: 'ExpireAt:')",
#    { match = "name(node1)", annotate = { add_latency = "-500ms" } },
#]
#
#[group.health-check]
#tcp-url = ["http://test.steampowered.com"]

[dns]
# "4", "6", or 0 for no preference.
ipversion-prefer = 0
# Every upstream is `tag:protocol://host:port`, and the tag is what `[dns.request]` rules
# name. The protocol is required: "UDP unless it fails" is a policy, not a default.
#
# Protocols: udp, tcp, tls (DoT), https (DoH), or a `+` chain tried in order.
# A name instead of an address is rejected for now — bootstrapping an upstream is a
# resolver problem of its own — so the address is written out.
upstream = ["alidns:udp://223.5.5.5:53", "googledns:tcp://8.8.8.8:53"]
# An IP, not an address: the port is always 53 (the removed `daer dns` verb's `--listen`
# flag is what used to override it, and nothing replaces it — a resolver that is not on 53 is
# not the box's resolver).
#bind = "0.0.0.0"
optimistic-cache = true
optimistic-cache-ttl = 60
optimistic-stale-reply-ttl = 30
max-cache-size = 65536

# Per-domain TTL overrides, in seconds.
[dns.fixed-domain-ttl]
#".example.com" = 60

[dns.request]
rules = []
# Where a request that matches no rule goes.
fallback = "googledns"

[dns.response]
rules = []
fallback = "accept"

# Rule Providers (ADR-0014, ADR-0019). A provider is a compiled `.drb` set or a plain-text rule file,
# local or remote. This is how `geoip:` / `geosite:` are expressed now: the `.dat` format is
# retired: unpack an existing .dat with scripts/rules/dat_to_rules.py and compile with daer-drb.
#
# Compile with daer-drb (ADR-0027: every source is read into one rule set, then encoded):
#   python3 scripts/rules/dat_to_rules.py --kind geosite --dat geosite.dat --code cn -o cn.rules
#   daer-drb compile cn.rules -o geosite-cn.drb
#   python3 scripts/rules/dat_to_rules.py --kind geoip --dat geoip.dat --code cn -o cn-ip.rules
#   daer-drb compile cn-ip.rules -o geoip-cn.drb
#
# Dedicated rules distribution repository: https://github.com/daer-proxy/drb-sets
# These URLs resolve once that repository has published its first build. Until then (or with
# no network at all) `daer check` names every provider it could not load and the cache path it
# looked in, rather than starting with an empty rule — that is the intended behaviour, not a
# failure of the example. Point `path` at a local `.drb` to work offline.
[[rule-provider]]
tag = "private"
type = "http"
url = "https://raw.githubusercontent.com/daer-proxy/drb-sets/release/geoip-private.drb"
format = "drb"
interval = "24h"

[[rule-provider]]
tag = "cn"
type = "http"
url = "https://raw.githubusercontent.com/daer-proxy/drb-sets/release/geosite-cn.drb"
format = "drb"
interval = "24h"

[[rule-provider]]
tag = "cn-ip"
type = "http"
url = "https://raw.githubusercontent.com/daer-proxy/drb-sets/release/geoip-cn.drb"
format = "drb"
interval = "24h"

[routing]
# Rules are evaluated top to bottom; the first match wins.
rules = [
    # Network managers should reach the network directly, otherwise binding to
    # the WAN interface produces a false-negative connectivity check.
    "pname(NetworkManager) -> direct",
    # Keep broadcast and multicast traffic away from the proxy.
    "dip(224.0.0.0/3, 'ff00::/8') -> direct",
    "provider(private) -> direct",
    # HTTP/3 usually costs more CPU and memory than it is worth.
    "l4proto(udp) && dport(443) -> block",
    # Domestic destinations: domains and addresses from the same provider tags.
    "provider(cn, cn-ip) -> direct",
]
# Where everything else goes.
fallback = "proxy"
