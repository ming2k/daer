# The kernel/userspace ABI, declared once (ADR-0021).
#
# `cargo xtask abi` generates both sides from this file:
#   ebpf/kern/daer_abi.h                 the C header
#   crates/daer-ebpf/src/generated.rs    the Rust constants and layout assertions
#
# `cargo xtask abi --check` regenerates into a temporary directory and diffs, so a hand
# edit to either generated file — or a change here without regenerating — is a red build.
#
# Sizes are in bytes. Field offsets are derived by the generator from the declared field
# order and type sizes, and emitted as assertions on the Rust side.

schema = 1

# The `const volatile` global the loader overrides before `BPF_PROG_LOAD`.
[params]
global = "PARAM"
c_struct = "daer_param"

[[params.fields]]
name = "tproxy_port"
c_type = "u32"

[[params.fields]]
name = "control_plane_pid"
c_type = "u32"

[[params.fields]]
name = "device_ifindex"
c_type = "u32"

[[params.fields]]
name = "netns_id"
c_type = "u32"

[[params.fields]]
name = "peer_mac"
c_type = "[u8; 6]"

[[params.fields]]
name = "padding_after_mac"
c_type = "[u8; 2]"

[[params.fields]]
name = "use_redirect_peer"
c_type = "u8"

[[params.fields]]
name = "has_bpf_get_current_task"
c_type = "u8"

[[params.fields]]
name = "datapath_generation"
c_type = "u16"

[[params.fields]]
name = "socket_mark"
