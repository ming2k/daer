name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # The datapath is C from upstream; the object test is the ABI contract with it.
  # It is a separate job because it needs clang and the kernel headers, which the
  # fast job must not wait for.
  ebpf-object:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build the datapath object
        run: cargo xtask ebpf
      - name: Check the ABI against it
        run: cargo test -p daer-ebpf --test object
