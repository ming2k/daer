name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # The ABI drift gate (ADR-0021, [INV-ABI-01]). It has to be here and not only in a
      # local convenience command: until this step existed, `abi.toml`, the C header and the
      # generated Rust module could disagree and every check above stayed green. The generated files are tracked, so this compares committed bytes.
      - name: Kernel ABI drift
        run: cargo xtask abi --check
      # The diagnostic contract (ADR-0040). This is not a docs lint: the catalog generates
      # the EventCode enum, and the check fails on a raw tracing macro or a call-site severity
      # that disagrees with the declared contract.
      - name: Diagnostic event catalog
        run: cargo xtask events --check
      - name: Incident records
        run: cargo xtask incident --check
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Tests are selected with nextest filtersets (ADR-0052). The architecture audit is a
      # normal integration test now, so it cannot be dropped from CI without deleting the
      # test that proves the harness structure.
      - name: Unit tests (L1)
        run: cargo nextest run --workspace -E 'kind(lib) + kind(bin)' --locked --profile ci
      - name: Documentation examples (L1)
        run: cargo test --workspace --doc --locked

  # The integration layer compiles the real components against real loopback peers. It is a
  # separate job so it can run in parallel with the unit layer and so a failure names which
  # rung of the pyramid broke.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Build the binaries the CLI tests exercise
        run: cargo build -p daer-cli -p daer-drb --bins --locked
      - name: Integration tests (L2)
        run: cargo nextest run --workspace -E 'binary(integration)' --locked --profile ci

  # Advisory, license, source and duplicate-version policy in `deny.toml`.
  # A lockfile update is the usual way a vulnerable or non-permissive dependency
  # arrives, so this gate belongs on every push, not only on release.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The kernel datapath and the REALITY interop are fixtures CI exercises, and until this
  # job existed that claim was false: `cargo test
  # --workspace` runs `tests/transparent.rs` on a stock runner where it skips itself (no
  # CAP_NET_ADMIN), and it does not install `xray`, so `tests/reality_interop.rs` skipped too.
  # Two green ticks over two skips is exactly what ADR-0007 forbids, so both get a job here and
  # `DAER_REQUIRE` turns a skip in either into a failure.
  kernel-datapath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Install the fixture tools
        # `xray` is the reference implementation the interop test spawns; `nftables` is what the
        # transparent test installs its own redirect with. Both are released binaries, not
        # services, so the gate needs no credential and no uptime from anyone.
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables curl unzip
          curl -fsSL -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-linux-64.zip
          sudo unzip -o -q /tmp/xray.zip xray -d /usr/local/bin
          xray version
      - name: Build the datapath objects (the production one and the test one)
        # `kernel-check.sh` needs both: `datapath.bpf.o` for the verifier and attach cases, and
        # `datapath_test.bpf.o` — which only `--tests` compiles — for the in-kernel cases. The
        # `--tests` half used to be missing here, so section 7 skipped and `DAER_REQUIRE`
        # never named a key that would have noticed.
        run: cargo xtask ebpf --tests
      - name: Kernel datapath (verifier, tc attach, in-kernel cases)
        # The keys are the script's own (`scripts/verify/kernel-check.sh`), not section numbers: a
        # key in `DAER_REQUIRE` turns its *skip* into a failure. This list said
        # `7-tcp,8` — neither of which this script emits — so every check could skip and
        # the job still exited zero. The UDP half of the in-kernel cases still has a named
        # prerequisite this runner cannot meet, which is why `7` is the key and not `7-udp`.
        env:
          DAER_REQUIRE: "kernel-binary,7"
        run: scripts/verify/kernel-check.sh
      - name: REALITY + Vision interop against the reference node
        # Captured, then inspected: the test skips itself when it cannot find `xray`, and a skip
        # that reads as a pass is the failure this job exists to end.
        run: |
          set -o pipefail
          cargo nextest run -p daer-tests -E 'binary(e2e) & test(~reality_interop)' \
            --locked --no-capture --no-fail-fast 2>&1 | tee /tmp/interop.log
          if grep -q "skipped: no \`xray\` binary" /tmp/interop.log; then
            echo "::error::the REALITY interop suite skipped; it is the only end-to-end gate on that path"
            exit 1
          fi
      - name: A TLS stream through the tunnel (the case plaintext tests cannot see)
        # Vision only takes its raw-copy path for TLS, so a plaintext payload passes even when the
        # client is broken — which is exactly how the `Direct` defect shipped. This is the gate
        # that would have caught it.
        run: |
          set -o pipefail
          cargo nextest run -p daer-tests -E 'binary(e2e) & test(~vision_tls_inside)' \
            --locked --no-capture --no-fail-fast 2>&1 | tee /tmp/tls-inside.log
          if grep -q "skipped: no \`xray\` binary" /tmp/tls-inside.log; then
            echo "::error::the inner-TLS suite skipped; it is the only gate on Vision's raw-copy path"
            exit 1
          fi

  # The user-space ingress path. `e2e-check.sh` answers a different question from
  # `kernel-check.sh` — does a real tproxy redirect reach `daer run` and come back — and it
  # is the only job that runs `tests/e2e/control_transparent.rs` and `tests/e2e/cli_reload.rs`
  # with the capability they need. Both skip themselves on the `test` job above, and a suite
  # that skips is not coverage (ADR-0007), so without this job the ingress path and the
  # `SIGHUP` fix had no CI evidence at all.
  e2e-ingress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Install the fixture tools
        run: sudo apt-get update && sudo apt-get install -y nftables curl
      - name: The transparent data path and a real SIGHUP
        # `3-udp` is deliberately absent: the old single-namespace IPv4 fixture is invalid
        # (the origin and the transparent reply socket must own the same address and port).
        # `3-udp4` and `3-udp6` are the two-namespace datagram gates. `3-netns` is required
        # because the private ingress lifecycle is a production claim, not an optional
        # convenience; it was emitted by the script but absent from this list, so it could
        # skip while the job stayed green.
        env:
          DAER_REQUIRE: "3-tcp,3-tcp6,3-udp4,3-udp6,3-netns,4"
        run: scripts/verify/e2e-check.sh

  # The datapath is C from upstream; the object test is the ABI contract with it.
  # It is a separate job because it needs clang and the kernel headers, which the
  # fast job must not wait for.
  ebpf-object:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build the datapath object
        run: cargo xtask ebpf
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Check the ABI against it
        run: cargo nextest run -p daer-tests -E 'test(~ebpf_object)' --locked
      # The same unprivileged gate the package build runs: the object this job
      # just built must be one `daer check` accepts, not merely one whose
      # section names match at compile time.
      - name: Unprivileged preflight
        run: cargo xtask preflight
