[package]
name = "daer-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Workspace-level integration and end-to-end test harness for daer"
publish = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    "crates/daer-cli",
    "crates/daer-common",
    "crates/daer-config",
    "crates/daer-control",
    "crates/daer-dns",
    "crates/daer-ebpf",
    "crates/daer-observe",
    "crates/daer-outbound",
    "crates/daer-proxy-protocols",
    "crates/daer-relay",
    "crates/daer-routing",
    "crates/daer-rule-ast",
    "crates/daer-sniff",
    "crates/daer-drb",
    "crates/daer-test-support",
    "crates/xtask",
]

[workspace.package]
version = "0.0.14"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
authors = ["daer contributors"]
repository = "https://github.com/ming2k/daer"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "warn"

[workspace.dependencies]
daer-common = { path = "crates/daer-common" }
daer-config = { path = "crates/daer-config" }
daer-control = { path = "crates/daer-control" }
daer-dns = { path = "crates/daer-dns" }
daer-ebpf = { path = "crates/daer-ebpf" }
daer-observe = { path = "crates/daer-observe" }
daer-outbound = { path = "crates/daer-outbound" }
daer-proxy-protocols = { path = "crates/daer-proxy-protocols" }
daer-relay = { path = "crates/daer-relay" }
daer-routing = { path = "crates/daer-routing" }
daer-rule-ast = { path = "crates/daer-rule-ast" }
daer-sniff = { path = "crates/daer-sniff" }
daer-test-support = { path = "crates/daer-test-support" }

aes = "0.8"
blake2 = "0.10"
blake3 = "1.5"
aes-gcm = "0.10"
anyhow = "1.0"
bytes = "1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
sha3 = "0.10"
hkdf = "0.12"
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"
zeroize = "1.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
arc-swap = "1.9"
aya = "0.14"
clap = { version = "4.5", features = ["derive"] }
fastrand = "2.3"
getrandom = "0.3"
ml-kem = "0.2.3"
rand_core = "0.6.4"
glob = "0.3"
ipnet = "2.11"
libc = "0.2"
# Upstream transport library, locked via Cargo.lock. The tag names the released
# combination.
netune = { git = "https://github.com/ming2k/netune.git", tag = "v0.0.28", default-features = false, features = ["ws", "quic", "http3"] }
netune-http1 = { git = "https://github.com/ming2k/netune.git", tag = "v0.0.28" }
netune-trace = { git = "https://github.com/ming2k/netune.git", tag = "v0.0.28" }
netune-ws = { git = "https://github.com/ming2k/netune.git", tag = "v0.0.28" }
netune-quic = { git = "https://github.com/ming2k/netune.git", tag = "v0.0.28" }
netune-http3 = { git = "https://github.com/ming2k/netune.git", tag = "v0.0.28" }
regex = "1.11"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.6"
sha2 = "0.10"
thiserror = "2.0"
toml = "1.1"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "time",
    "signal",
    "sync",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
aes.workspace = true
aes-gcm.workspace = true
aya.workspace = true
aya-obj = "0.3"
blake2.workspace = true
blake3.workspace = true
bytes.workspace = true
chacha20poly1305.workspace = true
daer-common.workspace = true
daer-config = { workspace = true, features = ["schema"] }
daer-control.workspace = true
daer-dns.workspace = true
daer-ebpf.workspace = true
daer-observe.workspace = true
daer-outbound.workspace = true
daer-proxy-protocols.workspace = true
daer-relay.workspace = true
daer-routing.workspace = true
daer-rule-ast.workspace = true
daer-sniff.workspace = true
daer-test-support.workspace = true
hkdf.workspace = true
libc.workspace = true
md-5.workspace = true
ipnet.workspace = true
netune.workspace = true
netune-trace.workspace = true
netune-ws.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# A root-cause build is not the shipped build. It keeps line tables and unwinding so a panic
# hook can capture a backtrace and the `FlowGuard`/RAII cleanup paths can run, at the cost of
# size and a little speed. Use it when reproducing a production failure that has no useful
# release backtrace; the incident bundle from the release build still names the flow and event
# sequence, and this profile explains the frame.
[profile.forensic]
inherits = "release"
debug = "line-tables-only"
strip = "none"
panic = "unwind"

# `dev` and `test` carry full debuginfo by default, and for this workspace that is the
# dominant cost of the build rather than a nicety:
#
# * a single test binary links to 77–110 MB, of which `size` attributes ~14 MB to text;
# * there are 23 test targets, and every one of them links the **whole** dependency graph
#   again — 759 executables and ~53 GB of `target/debug/deps` was measured on a warm tree;
# * cargo runs them in parallel, so a change to one library re-links most of the workspace at
#   once. A no-op `cargo test --no-run --workspace` takes 169 ms; the same command after
#   touching one file's library took 666 s, all of it linking.
#
# `line-tables-only` keeps the thing debuginfo is actually used for here — a panic message
# and a backtrace that name the source line — and drops the type and variable metadata that
# accounts for most of the bytes. Dependencies get no debuginfo at all: when a test fails, the
# frame that matters is in this workspace, and `[profile.dev.package."*"]` is the lever that
# keeps a rebuild of our own code from re-encoding every third-party crate.
#
# `split-debuginfo` writes the debug sections beside the binary instead of into it, which is
# what keeps the linker from rewriting a 100 MB file on every rebuild of an unrelated crate.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test.package."*"]
debug = false
