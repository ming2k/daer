# The exact netune the workspace is developed against.
#
# `daer` consumes netune as a path dependency (`../netune`) so that both projects
# can be changed together, which makes "which netune" implicit. This file makes it
# explicit, and `scripts/check-pins.sh` (run by `make pins`, and by CI) fails when
# the checkout has moved without the pin being updated.
#
# Updating the pin:
#   1. `git -C ../netune log --oneline <old>..<new>` and read every entry that
#      touches transport, TLS, DNS or socket options.
#   2. `cargo test --workspace`
#   3. Update `rev`/`tag` here and note the reason in the commit message.

[netune]
path = "../netune"
rev = "4159ebdeb10267245e942d84b526307db7194efd"
tag = "v0.0.4"
version = "0.0.4"
reason = """
  4159ebd netune 0.0.4: datagram transport, SO_MARK before connect, UDP tracing
"""
