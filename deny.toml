# Dependency policy for daer (supply-chain and advisory gate).
# Enforced in CI by `cargo deny check`.

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# The workspace is not published to a registry, so internal path dependencies
# do not need a version requirement. Third-party dependencies are still pinned by
# Cargo.lock and by the workspace dependency table.
multiple-versions = "warn"
wildcards = "warn"
deny = [
    # The REALITY/TLS boundary keeps exactly one crypto provider (ADR-0035).
    { name = "ring" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/ming2k/netune.git"]
