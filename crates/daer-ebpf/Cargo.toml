[package]
name = "daer-ebpf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "eBPF object loading and map ABI for daer"

[dependencies]
daer-common.workspace = true
ipnet.workspace = true
aya = { workspace = true, optional = true }
# `inspect_bytes` parses an object and reproduces aya's call relocation without loading it,
# which is what lets `daer check` gate a packaged artifact unprivileged (ADR-0029).
aya-obj = "0.3"

[dev-dependencies]
libc.workspace = true

[features]
default = ["loader"]
loader = ["dep:aya"]

[[test]]
name = "kernel"

[lints]
workspace = true
