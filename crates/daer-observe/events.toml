fields = ["step", "interface", "path", "error"]
counter = "datapath.cleanup_failed"
rate = "datapath.cleanup_failed"
remediation = "Run `daer-cleanup`; the recovery journal is kept for ExecStopPost or the next start."

[[events]]
name = "DatapathIpv6Unavailable"
code = "datapath.ipv6_unavailable"
level = "warn"
message = "IPv6 datapath is unavailable; IPv4 continues"
fields = ["component", "error"]
counter = "datapath.ipv6_unavailable"
rate = "datapath.ipv6_unavailable"
