[[events]]
name = "DatapathTelemetryFailed"
code = "datapath.telemetry_failed"
level = "warn"
message = "datapath telemetry read failed"
fields = ["error"]
counter = "datapath.telemetry_failed"
rate = "datapath.telemetry_failed"
remediation = "The counters or ring are no longer readable; collect the daemon log and inspect the loaded object before the next reload."

[[events]]
name = "DatapathStats"
code = "datapath.stats"
level = "info"
