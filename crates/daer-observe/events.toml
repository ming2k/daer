counter = "provider.unusable_tcp_method"
rate = "provider.unusable_tcp_method"
remediation = "Use a valid HTTP method for the health probe."

[[events]]
name = "ProviderUnresolvedUdp"
code = "provider.unresolved_udp"
level = "debug"
