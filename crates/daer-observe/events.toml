fields = ["reasons"]
counter = "dryrun.kernel_deferral"
rate = "dryrun.kernel_deferral"
remediation = "Traffic is correct but the kernel fast path is not in effect; rewrite the named predicates or accept the userspace relay hop."

[[events]]
name = "DryRunListen"
code = "dryrun.listen"
level = "info"
message = "would listen for redirected flows"
fields = ["port", "so_mark", "namespace", "generation"]

[[events]]
name = "DryRunInterfaces"
code = "dryrun.interfaces"
level = "info"
message = "would attach to these interfaces"
fields = ["lan", "wan"]

[[events]]
name = "DryRunHostSysctlMissing"
code = "dryrun.host_sysctl_missing"
level = "warn"
message = "host sysctl prerequisite is not met"
fields = ["error"]
counter = "dryrun.host_sysctl_missing"
rate = "dryrun.host_sysctl_missing"
remediation = "Run `daer check --dry-run` on the host that will serve traffic; a real run would refuse to start."

[[events]]
name = "DryRunNoDatapath"
code = "dryrun.no_datapath"
level = "warn"
message = "no datapath"
fields = []
counter = "dryrun.no_datapath"
rate = "dryrun.no_datapath"
remediation = "Nothing is redirected into the transparent port; do not use this mode to serve traffic."

[[events]]
name = "DryRunObjectValid"
code = "dryrun.object_valid"
level = "info"
message = "datapath object is valid"
fields = ["object", "maps", "programs"]

[[events]]
name = "DryRunPairState"
code = "dryrun.pair_state"
level = "info"
message = "pair state"
fields = ["device_present", "peer_present", "state"]

[[events]]
name = "DryRunCapabilitiesPresent"
code = "dryrun.capabilities_present"
level = "info"
message = "capabilities present"
fields = []

[[events]]
name = "DryRunPrivilegedSkipped"
code = "dryrun.privileged_skipped"
level = "warn"
message = "the privileged phase would not run here"
fields = ["reason"]
counter = "dryrun.privileged_skipped"
rate = "dryrun.privileged_skipped"
remediation = "Run the privileged gate on a host with CAP_BPF, CAP_NET_ADMIN, CAP_PERFMON and CAP_SYS_ADMIN."

[[events]]
name = "DryRunComplete"
code = "dryrun.complete"
level = "info"
message = "dry-run complete"
fields = []

# ---------------------------------------------------------------------------
# Configuration generations
# ---------------------------------------------------------------------------

[[events]]
name = "GenerationLoaded"
code = "generation.loaded"
level = "info"
message = "configuration loaded"
fields = ["generation", "rules", "groups", "nodes", "build_ms", "policy_hash"]

[[events]]
name = "GenerationReloaded"
code = "generation.reloaded"
level = "info"
message = "configuration reloaded"
fields = ["generation", "previous", "rules", "groups", "nodes", "routing_changed", "build_ms", "policy_hash", "source"]

[[events]]
name = "GenerationStartupRejected"
code = "generation.startup_rejected"
level = "error"
message = "configuration rejected; nothing is serving"
fields = ["generation", "error", "error_code"]
counter = "generation.startup_rejected"
rate = "generation.startup_rejected"
remediation = "Run `daer check -c <config>` and fix the reported error; the daemon cannot serve without a generation."

[[events]]
name = "GenerationReloadRejected"
code = "generation.reload_rejected"
level = "error"
message = "configuration reload rejected; the running generation is unchanged"
fields = ["generation", "serving", "error", "error_code"]
counter = "generation.reload_rejected"
rate = "generation.reload_rejected"
remediation = "Run `daer check -c <config>`; the previous generation is still serving, so this is not an outage."

