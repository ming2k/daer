fields = ["node", "protocol", "message"]
counter = "generation.node_unselectable"
rate = "generation.node_unselectable"
remediation = "Use a supported protocol for this node or remove it; an unknown protocol is never downgraded to direct."

[[events]]
name = "ProviderRefreshSkipped"
code = "provider.refresh_skipped"
level = "error"
message = "rule provider refresh skipped: the configuration does not load"
fields = ["error"]
counter = "provider.refresh_skipped"
rate = "provider.refresh_skipped"
remediation = "Fix the configuration; the running generation is unchanged."

[[events]]
name = "ProviderRemoved"
code = "provider.removed"
level = "debug"
message = "rule provider no longer declared"
fields = ["tag"]

[[events]]
name = "ProviderUpdated"
code = "provider.updated"
level = "info"
message = "rule provider updated"
