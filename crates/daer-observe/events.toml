[[events]]
name = "DatapathSysctlRestoreFailed"
code = "datapath.sysctl_restore_failed"
level = "warn"
message = "could not restore a host sysctl"
fields = ["path", "error"]
counter = "datapath.sysctl_restore_failed"
rate = "datapath.sysctl_restore_failed"
remediation = "Run `daer-cleanup`; the recovery journal is kept for the next start."

[[events]]
name = "DatapathPeerDetachFailed"
code = "datapath.peer_detach_failed"
level = "warn"
message = "could not detach the peer ingress link"
fields = ["error"]
counter = "datapath.peer_detach_failed"
rate = "datapath.peer_detach_failed"
