# The daer event catalog (ADR-0040).
#
# This file is the single source for event codes, severities, required fields,
# counters, rate-limit groups and operator remediation. `cargo xtask events`
# generates `crates/daer-observe/src/generated.rs` and
# `docs/reference/events.md`; `cargo xtask events --check` fails on drift.
#
# Rules:
#   * `code` is the stable contract. Dotted lower-case, namespace first.
#   * `level` is the contract, not a call-site choice. The macro used at the
#     call site must match it.
#   * every `warn`/`error` event declares `counter`, `rate` and `remediation`.
#   * `fields` names the content a future investigator needs. Adding a field is
#     a compatible change; removing one is a contract change.

schema = 1

# ---------------------------------------------------------------------------
# Daemon lifecycle and build provenance
# ---------------------------------------------------------------------------

[[events]]
name = "DaemonBuild"
code = "daemon.build"
level = "info"
message = "daemon build"
fields = ["version", "commit", "dirty", "built_at", "rustc", "target", "netune", "object_sha256"]

[[events]]
name = "DaemonReady"
code = "daemon.ready"
level = "info"
message = "daemon ready"
fields = ["run_id", "generation", "datapath", "port", "namespace", "so_mark"]

[[events]]
name = "DaemonInterfacesResolved"
code = "daemon.interfaces_resolved"
level = "info"
message = "interfaces resolved"
fields = ["lan", "wan"]

[[events]]
name = "DaemonListening"
code = "daemon.listening"
level = "info"
message = "listening for redirected flows"
fields = ["port", "so_mark", "namespace", "generation"]

[[events]]
name = "DaemonDatapathAttached"
code = "daemon.datapath_attached"
level = "info"
message = "datapath attached"
fields = ["port", "namespace", "device", "peer", "lan", "wan", "object", "object_sha256", "maps", "programs", "policy_hash"]

[[events]]
name = "DaemonDatapathRebuilt"
code = "daemon.datapath_rebuilt"
level = "info"
message = "generation rebuilt with the datapath's flow facts"
fields = ["generation"]

[[events]]
name = "DaemonDatapathRebuildFailed"
code = "daemon.datapath_rebuild_failed"
level = "warn"
message = "could not rebuild the generation with the datapath's flow facts"
fields = ["error"]
counter = "daemon.datapath_rebuild_failed"
rate = "daemon.datapath_rebuild_failed"
remediation = "mac/dscp/pname rules will not match until the generation rebuild succeeds; fix the reported error and reload."

[[events]]
name = "DaemonRecoveryWarning"
code = "daemon.recovery_warning"
level = "warn"
message = "could not fully recover state from a previous run"
fields = ["error"]
counter = "daemon.recovery_warning"
rate = "daemon.recovery_warning"
remediation = "Inspect `/run/daer` and run `daer-cleanup`; a stale TC filter or sysctl may still be installed."

[[events]]
name = "DaemonConfigWarning"
code = "daemon.config_warning"
level = "warn"
message = "configuration warning"
fields = ["warning"]
counter = "daemon.config_warning"
rate = "daemon.config_warning"
remediation = "Run `daer check` and fix the reported configuration warning."

[[events]]
name = "DaemonDnsStarted"
code = "daemon.dns_started"
level = "info"
message = "dns server started"
fields = ["plan", "fake_ip"]

[[events]]
name = "DaemonDnsNotStarted"
code = "daemon.dns_not_started"
level = "info"
message = "dns server not started"
fields = []

[[events]]
name = "DaemonDnsStoppedWithError"
code = "daemon.dns_stopped_with_error"
level = "warn"
message = "dns server stopped with an error"
fields = ["error"]
counter = "daemon.dns_stopped_with_error"
rate = "daemon.dns_stopped_with_error"
remediation = "DNS-based routing and Fake-IP are unavailable; restart the daemon and inspect the resolver error."

[[events]]
name = "DaemonDnsTaskFailed"
code = "daemon.dns_task_failed"
level = "warn"
message = "dns server task did not finish"
fields = ["error"]
counter = "daemon.dns_task_failed"
rate = "daemon.dns_task_failed"
remediation = "The resolver task ended abnormally; restart the daemon and collect the incident bundle."

[[events]]
name = "DaemonUdpUnavailable"
code = "daemon.udp_unavailable"
level = "warn"
message = "the UDP relay is not running"
fields = ["error", "port"]
counter = "daemon.udp_unavailable"
rate = "daemon.udp_unavailable"
remediation = "TCP is unaffected; fix the datagram bind error and reload if UDP clients are expected."

[[events]]
name = "DaemonNoDatapath"
code = "daemon.no_datapath"
level = "warn"
message = "serving without the kernel datapath"
fields = []
counter = "daemon.no_datapath"
rate = "daemon.no_datapath"
remediation = "Nothing is redirected into the transparent port; this mode is for development, not traffic."

[[events]]
name = "DaemonHealthStarted"
code = "daemon.health_started"
level = "info"
message = "health scheduling started"
fields = ["interval"]

[[events]]
name = "DaemonHealthDisabled"
code = "daemon.health_disabled"
level = "debug"
message = "health probing not started"
fields = ["probes", "reason"]

[[events]]
name = "DaemonWaitingRoute"
code = "daemon.waiting_route"
level = "info"
message = "waiting for a default route"
fields = ["disable_waiting_network"]

[[events]]
name = "DaemonWaitingInterfaces"
code = "daemon.waiting_interfaces"
level = "info"
message = "waiting for the interfaces to come up"
fields = ["reason"]

[[events]]
name = "DaemonWanDetected"
code = "daemon.wan_detected"
level = "info"
message = "detected the WAN interface"
fields = ["interface"]

[[events]]
name = "DaemonStatusSocketFailed"
code = "daemon.status_socket_failed"
level = "debug"
message = "could not bind the read-only status socket"
fields = ["path", "error"]

[[events]]
name = "DaemonStateWriteFailed"
code = "daemon.state_write_failed"
level = "debug"
message = "could not write the runtime state snapshot"
fields = ["path", "error"]

[[events]]
name = "DaemonShutdown"
code = "daemon.shutdown"
level = "info"
message = "shutdown complete"
fields = ["drained", "in_flight", "accepted", "rejected", "failed", "exhausted", "panicked", "datagram", "dns"]

[[events]]
name = "DaemonStopping"
code = "daemon.stopping"
level = "info"
message = "stopped accepting; live flows keep relaying"
fields = ["in_flight"]

[[events]]
name = "DaemonSdNotifyDisabled"
code = "daemon.sd_notify_disabled"
level = "debug"
message = "systemd notifications are disabled"
fields = ["error"]

[[events]]
name = "DaemonSdNotifyFailed"
code = "daemon.sd_notify_failed"
level = "debug"
message = "could not send a systemd notification"
fields = ["error"]

# ---------------------------------------------------------------------------
# Dry-run report
# ---------------------------------------------------------------------------

[[events]]
name = "DryRunReport"
code = "dryrun.report"
level = "info"
message = "dry-run report"
fields = ["stage"]

[[events]]
name = "DryRunConfigCompiles"
