# `tests/shadowsocks_server.rs` is a shared helper, not a test target. Declaring the test
# targets explicitly is what keeps cargo from compiling it as a binary of its own.
[[test]]
name = "shadowsocks_interop"

[[test]]
name = "trojan_interop"

[[test]]
name = "reality_live"

[[test]]
name = "client_hello_probe"



[[test]]
name = "reality_tag_audit"


[[test]]
name = "vision_lab"





[lints]
workspace = true

[dev-dependencies]
# A real TLS server for the Trojan interop test: a certificate has to come from somewhere, and
# a hard-coded one would expire.
rcgen = "0.14"
tokio-rustls = "0.26"
